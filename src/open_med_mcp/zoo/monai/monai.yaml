name: monai
display_name: MONAI Model Zoo bundle (segmentation)
description: >-
  Run a segmentation or detection bundle from the MONAI Model Zoo (or a local bundle directory). Bundles are
  downloaded on first use, e.g. spleen_ct_segmentation, pancreas_ct_dints_segmentation,
  wholeBody_ct_segmentation, brats_mri_segmentation, prostate_mri_anatomy (task segment) and
  lung_nodule_ct_detection (task detect).
  Works with bundles whose inference config exposes `datalist` and `output_dir` (the standard
  MONAI segmentation bundle layout).
version: "0.1"
category: segmentation
tasks: [segment, detect, download]
default_task: segment
task_descriptions:
  segment: "Run a segmentation bundle's inference config on the input image"
  detect: "Run a detection bundle (e.g. lung_nodule_ct_detection, RetinaNet trained on LUNA16) and return boxes with scores"
  download: "Download the bundle into $OMM_HOME/weights/monai without running it"
modalities: [CT, MR, any]
dims: [3]
prompt_types: []
inputs:
  image: {kind: image, required: false, description: "Image matching the bundle's expected modality"}
outputs:
  mask: {kind: mask, description: "segment: label map written by the bundle (labels from its metadata.json)", required: false}
  detections: {kind: json, description: "detect: boxes (native voxel + world mm), scores, labels", required: false}
params:
  bundle: {type: string, default: spleen_ct_segmentation, description: "Bundle name in the MONAI Model Zoo, or a path to a local bundle directory"}
  version: {type: string, description: "Bundle version (default: latest)"}
  config: {type: string, default: configs/inference.json, description: "Inference config inside the bundle"}
  overrides: {type: object, description: "Extra config overrides passed to monai.bundle.run, e.g. {\"inferer#roi_size\": [96, 96, 96]}"}
  score_threshold: {type: number, default: 0.1, minimum: 0, maximum: 1, description: "detect: drop detections below this score"}
  max_detections: {type: integer, default: 50, description: "detect: keep the top-N detections"}
weights: []
container:
  gpu: preferred
  shm_size: 4g
local:
  entrypoint: run.py
  requires: [monai, torch, ignite]
  # detection bundles (LUNA16) also need `itk` for the ITK reader
  extra: monai
runners: [local, docker, apptainer]
license: Apache-2.0 (MONAI); each bundle carries its own license file
homepage: https://monai.io/model-zoo.html
citation: "Cardoso et al., MONAI: An open-source framework for deep learning in healthcare, arXiv:2211.02701 (2022)"
tags: [framework, model-zoo, segmentation, ct, mri, gpu]
