name: sam2
display_name: SAM 2.1 (Segment Anything 2.1)
description: >-
  Meta's Segment Anything Model 2.1 for promptable segmentation with points and boxes. 2D images
  are segmented with the image predictor; 3D volumes are segmented slice-by-slice with the video
  predictor (prompts on one slice are propagated through the stack). General-purpose weights
  (natural images) - for medical data prefer `medsam2`.
version: "0.1"
tasks: [segment]
modalities: [any]
dims: [2, 3]
prompt_types: [point, box]
inputs:
  image: {kind: image, required: true, description: "2D image or 3D volume"}
outputs:
  mask: {kind: mask, description: "Label map; label = object_id of the prompts"}
params:
  variant:
    type: string
    default: sam2.1_hiera_small
    choices: [sam2.1_hiera_tiny, sam2.1_hiera_small, sam2.1_hiera_base_plus, sam2.1_hiera_large, medsam2_latest, medsam2_ct_lesion, medsam2_mri_liver_lesion, medsam2_us_heart, medsam2_2411]
    description: "Checkpoint to use"
  prompts: {type: array, items: object, description: "Wire-format prompts (filled in by the `segment` tool)"}
  axis: {type: integer, default: 0, description: "NumPy axis of the volume to propagate along (0 = first array axis). Filled in by the server from `plane`."}
  window: {type: string, description: "Intensity window preset/dict/[lo,hi]; default soft-tissue for CT, auto otherwise"}
  propagate: {type: boolean, default: true, description: "3D: propagate the prompted slice through the volume"}
  max_slices: {type: integer, default: 0, description: "3D: max slices to propagate in each direction (0 = unlimited)"}
  stop_after_empty: {type: integer, default: 3, description: "3D: stop propagating after this many consecutive empty slices"}
  largest_component: {type: boolean, default: false, description: "Keep the largest connected component per object"}
  fill_holes: {type: boolean, default: false}
  multimask: {type: boolean, default: false, description: "2D: let SAM return 3 masks and keep the best-scoring one"}
weights:
  - {id: sam2.1_hiera_tiny, file: sam2.1_hiera_tiny.pt, url: "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt", sha256: 7402e0d864fa82708a20fbd15bc84245c2f26dff0eb43a4b5b93452deb34be69, size_mb: 156, license: Apache-2.0}
  - {id: sam2.1_hiera_small, file: sam2.1_hiera_small.pt, url: "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_small.pt", sha256: 6d1aa6f30de5c92224f8172114de081d104bbd23dd9dc5c58996f0cad5dc4d38, size_mb: 184, license: Apache-2.0}
  - {id: sam2.1_hiera_base_plus, file: sam2.1_hiera_base_plus.pt, url: "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_base_plus.pt", size_mb: 324, license: Apache-2.0}
  - {id: sam2.1_hiera_large, file: sam2.1_hiera_large.pt, url: "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt", size_mb: 898, license: Apache-2.0}
  - {id: medsam2_latest, file: MedSAM2_latest.pt, url: "https://huggingface.co/wanglab/MedSAM2/resolve/main/MedSAM2_latest.pt", sha256: c92743b99f00d078bf32a3afcc38aaa9faf1c1692dffe3eaa7a90938c1991060, size_mb: 156, license: Apache-2.0}
  - {id: medsam2_ct_lesion, file: MedSAM2_CTLesion.pt, url: "https://huggingface.co/wanglab/MedSAM2/resolve/main/MedSAM2_CTLesion.pt", size_mb: 156, license: Apache-2.0}
  - {id: medsam2_mri_liver_lesion, file: MedSAM2_MRI_LiverLesion.pt, url: "https://huggingface.co/wanglab/MedSAM2/resolve/main/MedSAM2_MRI_LiverLesion.pt", size_mb: 156, license: Apache-2.0}
  - {id: medsam2_us_heart, file: MedSAM2_US_Heart.pt, url: "https://huggingface.co/wanglab/MedSAM2/resolve/main/MedSAM2_US_Heart.pt", size_mb: 156, license: Apache-2.0}
  - {id: medsam2_2411, file: MedSAM2_2411.pt, url: "https://huggingface.co/wanglab/MedSAM2/resolve/main/MedSAM2_2411.pt", size_mb: 156, license: Apache-2.0}
container:
  gpu: preferred
  shm_size: 4g
local:
  entrypoint: run.py
  requires: [torch, sam2, hydra]
  extra: sam2
runners: [local, docker, apptainer]
license: Apache-2.0 (code and SAM 2.1 weights)
homepage: https://github.com/facebookresearch/sam2
citation: "Ravi et al., SAM 2: Segment Anything in Images and Videos, arXiv:2408.00714 (2024)"
tags: [promptable, foundation-model, points, boxes, 2d, 3d, gpu]
