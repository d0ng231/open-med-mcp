name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # setup-uv already created and activated .venv for the requested Python version
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Package
        run: |
          uv pip install build
          .venv/bin/python -m build
      - name: Smoke test the wheel
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/open-med-mcp --version
          /tmp/wheel-venv/bin/open-med-mcp models list
