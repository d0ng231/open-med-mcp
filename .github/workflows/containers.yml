name: Containers

# Builds the adapter images and pushes them to GHCR as
#   ghcr.io/<owner>/open-med-mcp-<adapter>:<version>  (and :latest)
# Runs on tags (v*) and manually. Set OMM_IMAGE_PREFIX=ghcr.io/<owner>/open-med-mcp on the
# client side if you publish under a different owner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      adapters:
        description: "Space-separated adapters to build (default: all)"
        default: "classical sam2 totalsegmentator lungmask hdbet nnunet monai torchxrayvision voxtell radiomics vlm"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [classical, sam2, totalsegmentator, lungmask, hdbet, nnunet, monai, torchxrayvision, voxtell, radiomics, vlm]
    steps:
      - uses: actions/checkout@v4
      - name: Skip adapters not requested
        if: github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.adapters, matrix.adapter)
        run: echo "skip=1" >> "$GITHUB_ENV"
      - name: Free disk space (CUDA images are large)
        if: env.skip != '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
        if: env.skip != '1'
      - uses: docker/login-action@v3
        if: env.skip != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        if: env.skip != '1'
        id: v
        run: |
          FILE=$(ls src/open_med_mcp/zoo/${{ matrix.adapter }}/*.yaml | head -1)
          VERSION=$(grep -m1 '^version:' "$FILE" | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: env.skip != '1'
        with:
          context: .
          file: src/open_med_mcp/zoo/${{ matrix.adapter }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/open-med-mcp-${{ matrix.adapter }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/open-med-mcp-${{ matrix.adapter }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
