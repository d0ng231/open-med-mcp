[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-med-mcp"
version = "0.1.0"
description = "An open, modular Model Context Protocol (MCP) server for medical image analysis agents: containerized models (MedSAM2, SAM 2.1, TotalSegmentator, lungmask, HD-BET, SynthStrip, nnU-Net, MONAI bundles, TorchXRayVision, VoxTell), preset/custom guidelines, and a code-customizable viewer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "open-med-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "medical-imaging", "segmentation", "segment-anything", "sam2", "medsam2", "totalsegmentator", "nnunet", "monai", "lungmask", "hd-bet", "synthstrip", "torchxrayvision", "voxtell", "radiology", "agents", "claude", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.6",
  "numpy>=1.24",
  "scipy>=1.10",
  "SimpleITK>=2.3",
  "pillow>=9.4",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "markdown>=3.5",
  "scikit-image>=0.21",
]

[project.optional-dependencies]
sam2 = ["torch>=2.5.1", "torchvision>=0.20.1", "sam2>=1.1.0", "hydra-core>=1.3.2"]
totalsegmentator = ["TotalSegmentator>=2.4"]
lungmask = ["lungmask>=0.2.20"]
hdbet = ["hd-bet>=2.0.1"]
nnunet = ["nnunetv2>=2.5"]
monai = ["monai[nibabel,ignite]>=1.4"]
torchxrayvision = ["torch>=2.5", "torchvision>=0.20", "torchxrayvision>=1.3"]
voxtell = ["voxtell>=0.1.0", "torch>=2.5.1,<2.9", "huggingface_hub>=0.25"]
models = ["open-med-mcp[sam2,totalsegmentator,lungmask,hdbet,nnunet,monai,torchxrayvision,voxtell]"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "build"]

[project.scripts]
open-med-mcp = "open_med_mcp.cli:app"

[project.urls]
Homepage = "https://github.com/d0ng231/open-med-mcp"
Documentation = "https://github.com/d0ng231/open-med-mcp/tree/main/docs"
Repository = "https://github.com/d0ng231/open-med-mcp"
Issues = "https://github.com/d0ng231/open-med-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_med_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/open_med_mcp", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
